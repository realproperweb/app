<style>
:root{--navy:#14305a;--teal:#1a8a9a;--sun:#ffb200;--ink:#0c1a2b;--paper:#fff;--mist:#e8f4f6;--line:#d5e3e7;--bg:#eef2ea;--muted:#51647a;--coral:#c8452d;--wa:#0f8a4b;--bar:rgba(255,255,255,.88)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#8db6ee;--teal:#4fc3d3;--ink:#e9f0f7;--paper:#13233a;--mist:#1a3149;--line:#2a4560;--bg:#0b1626;--muted:#9fb3c8;--coral:#ff8a72;--wa:#3fd17f;--bar:rgba(11,22,38,.9)}}
:root{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.mosaic{background:linear-gradient(90deg,#1a6fb8,#2bc0d0 35%,#f6f3d0 55%,#ffb200 78%,#f07a5a)}
.tile{background:linear-gradient(135deg,#1a8a9a,#14305a);color:#fff}
.num{font-variant-numeric:tabular-nums}
.tab[aria-current=page]{color:var(--navy)}
.tab[aria-current=page] svg{color:var(--sun)}
.ring{transition:stroke-dashoffset .8s ease}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

<script>
/* ---- Sample member data. Replace with the logged-in member's real data (API / database). ---- */
const M={name:'Thandi',biz:'Coastal Crafts in Ramsgate',status:'Listing live',
  views:1284,viewsDelta:12,enquiries:23,enquiriesNew:5,profile:72,services:3,
  invoices:{count:1,amount:1250,due:'31 Oct'},
  tasks:[{t:'Add photos of your business',done:false,msg:'add photos to my listing'},{t:'Confirm your opening hours',done:false,msg:'update my opening hours'},{t:'Reply to 5 new enquiries',done:false},{t:'Pay invoice due 31 Oct',done:false},{t:'Add your website address',done:false,msg:'add my website address to my listing'}]};

const $=id=>document.getElementById(id);
const WA_NUM='27689124033';
const wa=m=>`https://wa.me/${WA_NUM}?text=`+encodeURIComponent(m);
const ic=d=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/>',receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',cam:'<path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.7 10.7l6.6-4.4M8.7 13.3l6.6 4.4"/>',card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'};
const zar=n=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR',maximumFractionDigits:0}).format(n);
const nf=n=>new Intl.NumberFormat('en-ZA').format(n);

// welcome
const h=new Date().getHours(),greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
$('hi').textContent=`${greet}, ${M.name}!`;
$('biz').textContent=`Here’s how ${M.biz} is doing.`;
$('status').textContent=M.status;
$('avatar').textContent=M.name.slice(0,1).toUpperCase();
$('date').textContent=new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long'});

// quick actions
const shareMsg=encodeURIComponent(`Find ${M.biz} on the South Coast Business Hub!`);
$('actions').innerHTML=[['Edit listing',I.edit,wa(`Hi, I’d like to edit my listing on the South Coast Business Hub. Business: ${M.biz} (${M.name}).`)],['Add photos',I.cam,wa(`Hi, I’d like to add photos to my listing on the South Coast Business Hub. Business: ${M.biz} (${M.name}).`)],['Enquiries',I.mail,'/dashboard/enquiries'],['Share',I.share,`https://wa.me/?text=${shareMsg}`]]
 .map(([l,i,u])=>`<a href="${u}"${u.startsWith('http')?' target="_blank" rel="noopener"':''} class="flex flex-col items-center gap-1.5 rounded-2xl border-2 border-line bg-paper px-1 py-3 text-center text-xs font-bold text-navy active:scale-95 transition hover:border-teal"><span class="tile grid h-11 w-11 place-items-center rounded-xl">${ic(i)}</span>${l}</a>`).join('');

// stats
const card=(icon,label,value,sub,extra='',href='#')=>`<a href="${href}" class="flex flex-col gap-2 rounded-2xl border-2 border-line bg-paper p-3.5 hover:border-teal active:scale-[.98] transition">
  <div class="flex items-center gap-2 text-xs font-bold text-muted"><span class="tile grid h-8 w-8 place-items-center rounded-lg">${icon.replace('width="24" height="24"','width="18" height="18"')}</span>${label}</div>
  <p class="num font-display font-extrabold text-navy text-3xl leading-none" ${extra}>${value}</p>
  <p class="text-xs text-muted">${sub}</p></a>`;
const R=24,C=2*Math.PI*R,open=M.tasks.filter(t=>!t.done).length;
$('stats').innerHTML=
 card(ic(I.eye),'Listing views',nf(M.views),`<b class="text-wa">▲ ${M.viewsDelta}%</b> vs previous 30 days`,'','/dashboard/listing')+
 card(ic(I.mail),'Enquiries',nf(M.enquiries),`<b class="text-teal">${M.enquiriesNew} new</b> to reply to`,'','/dashboard/enquiries')+
 `<a href="${wa(`Hi, I’d like to complete my profile for ${M.biz} on the South Coast Business Hub.`)}" target="_blank" rel="noopener" class="flex flex-col gap-2 rounded-2xl border-2 border-line bg-paper p-3.5 hover:border-teal active:scale-[.98] transition">
   <div class="flex items-center gap-2 text-xs font-bold text-muted"><span class="tile grid h-8 w-8 place-items-center rounded-lg">${ic(I.user).replace('width="24" height="24"','width="18" height="18"')}</span>Profile</div>
   <div class="flex items-center gap-3"><svg viewBox="0 0 56 56" width="56" height="56" role="img" aria-label="Profile ${M.profile}% complete"><circle cx="28" cy="28" r="${R}" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="ring" class="ring" cx="28" cy="28" r="${R}" fill="none" stroke="var(--sun)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 28 28)"/></svg><p class="num font-display font-extrabold text-navy text-3xl leading-none">${M.profile}%</p></div>
   <p class="text-xs text-muted">Profile completion</p></a>`+
 card(ic(I.brief),'Active services',M.services,'On your plan','','/dashboard/services')+
 card(ic(I.receipt),'Outstanding',zar(M.invoices.amount),`<b class="text-coral">${M.invoices.count} invoice${M.invoices.count===1?'':'s'}</b> · due ${M.invoices.due}`,'','/dashboard/billing')+
 card(ic(I.check),'Pending tasks',open,'Tap below to tick off','id="taskCount"','#tk');
requestAnimationFrame(()=>setTimeout(()=>{$('ring').style.strokeDashoffset=C*(1-M.profile/100)},50));

// tasks
function drawTasks(){
  $('tasks').innerHTML=M.tasks.map((t,i)=>`<li class="flex items-center gap-2 pr-3 hover:bg-mist"><label class="flex flex-1 cursor-pointer items-center gap-3 px-4 py-3.5"><input type="checkbox" data-i="${i}" ${t.done?'checked':''} class="h-5 w-5 shrink-0 accent-teal"><span class="text-sm font-semibold ${t.done?'line-through text-muted':''}">${t.t}</span></label>${t.msg&&!t.done?`<a href="${wa(`Hi, I’d like to ${t.msg} on the South Coast Business Hub. Business: ${M.biz} (${M.name}).`)}" target="_blank" rel="noopener" class="shrink-0 rounded-full px-3 py-1.5 text-xs font-bold" style="background:#25D366;color:#073b1c">WhatsApp</a>`:''}</li>`).join('');
  const n=M.tasks.filter(t=>!t.done).length;
  $('taskNote').textContent=n?`${n} to do`:'All done 🎉';
  if($('taskCount'))$('taskCount').textContent=n;
}
$('tasks').addEventListener('change',e=>{const i=e.target.dataset.i;if(i!==undefined){M.tasks[i].done=e.target.checked;drawTasks()}});
drawTasks();

// bottom tabs
$('tabs').innerHTML=[['Home',I.home,'/dashboard'],['Listing',I.pin,'/dashboard/listing'],['Enquiries',I.mail,'/dashboard/enquiries'],['Billing',I.card,'/dashboard/billing'],['Account',I.user,'/dashboard/account']]
